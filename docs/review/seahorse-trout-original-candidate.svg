<text x="55" y="115" font-family="DejaVu Sans,sans-serif" font-size="44" fill="#fff" font-weight="700">Two fish. Different designs.</text>
<text x="55" y="157" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#e1efef" font-weight="400">A seahorse and a trout share a fish body plan with striking adaptations.</text>
