<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1510" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc"><title id="title">Two fish, different designs: seahorse and trout</title><desc id="desc">Original schematic comparison of external anatomy. Seahorse: tubular snout and small mouth, gill opening, pectoral fin, bony plates, dorsal fin, anal fin, male brood pouch and grasping tail. Trout: gill cover, pectoral fin, scales, dorsal fin, pelvic fin, anal fin, adipose fin and caudal fin. Simplified lateral views, not to scale.</desc>
