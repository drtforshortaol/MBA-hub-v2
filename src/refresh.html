<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Load latest MBA V2 test</title><style>body{font:17px system-ui;background:#f4f7f7;color:#123e50;max-width:600px;margin:60px auto;padding:24px}p{line-height:1.6}a{color:#125d70}</style></head><body><h1>Loading the latest V2 test</h1><p id="status" role="status">Checking the complete offline update…</p><p>This replaces only the V2 test version. It does not clear V1 or your website data.</p><a href="index.html?home=1">Return to Hub</a><script>
(async()=>{
 const status=document.querySelector('#status'),root=new URL('./',location.href);let returned=false;
 const reopen=()=>{if(returned)return;returned=true;location.replace(new URL('index.html?home=1',root));};
 function command(worker,type){return new Promise((resolve,reject)=>{const channel=new MessageChannel(),timer=setTimeout(()=>reject(Error('The update check timed out. Please reopen this refresh link while online.')),45000);channel.port1.onmessage=e=>{clearTimeout(timer);e.data.error?reject(Error(e.data.error)):resolve(e.data);};worker.postMessage({type},[channel.port2]);});}
 function installed(worker){if(!worker||worker.state==='installed'||worker.state==='activated')return Promise.resolve();return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Offline preparation is taking longer than expected. Please try this refresh link again.')),60000);worker.addEventListener('statechange',()=>{if(worker.state==='installed'||worker.state==='activated'){clearTimeout(timer);resolve();}else if(worker.state==='redundant'){clearTimeout(timer);reject(Error('The update could not be verified. Your previous version remains available.'));}});});}
 try{
  if(!('serviceWorker' in navigator))throw Error('Open this link in Safari while connected to the internet.');
  const registration=await navigator.serviceWorker.register(new URL('sw.js',root),{scope:root.pathname,updateViaCache:'none'});await registration.update();
  await installed(registration.installing);
  const waiting=registration.waiting;
  if(waiting){status.textContent='Verifying the new offline bundle…';navigator.serviceWorker.addEventListener('controllerchange',reopen,{once:true});await command(waiting,'ACTIVATE_UPDATE');setTimeout(reopen,2000);}
  else{const active=registration.active;if(!active)throw Error('Offline installation is not ready yet. Please try again while online.');const result=await command(active,'STATUS');const liveResponse=await fetch(new URL('release.json',root),{cache:'no-store'});if(!liveResponse.ok)throw Error('The current release could not be checked. Please try again online.');const live=await liveResponse.json();if(result.release!==live.release)throw Error('The latest update is still preparing. Please reopen this refresh link in a moment.');if(!result.complete)throw Error('Offline files are not complete yet. Please revisit while online.');reopen();}
 }catch(e){status.textContent=e.message;}
})();
</script></body></html>
