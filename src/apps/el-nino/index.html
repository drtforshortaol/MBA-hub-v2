<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#064b83"><title>El Niño | MBA Hub V2</title><style>body{margin:0;background:#052d50;color:white;font:16px system-ui}header{padding:14px;display:flex;gap:15px;align-items:center;background:#064b83}a,button{color:white;background:#086da6;border:1px solid #8bd9ff;border-radius:8px;padding:10px;text-decoration:none;cursor:pointer}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:clamp(25px,5vw,42px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:#104e78;padding:20px;text-align:left}.viewer{position:fixed;inset:0;background:#001725;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:3}.viewer.open{display:flex}.viewer img{max-width:96vw;max-height:78vh;object-fit:contain}.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:12px}.note{color:#d6efff}</style><header><a href="../../index.html">← Return to Hub</a><strong>Concepts / El Niño</strong></header><main><h1>El Niño — Ocean & Climate</h1><p class="note">Educational module under development. Illustrations are being prepared for inclusion. Scientific review is required before visitor-facing release.</p><div class="grid" id="grid"></div></main><div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Illustration viewer"><div class="controls"><button id="close">✕ Close</button><button id="prev">← Previous</button><span id="count"></span><button id="next">Next →</button></div><img id="slide" alt="" hidden><div id="pending" style="width:min(94vw,1000px);aspect-ratio:16/9;border:2px dashed #76b9dc;border-radius:12px;display:grid;place-items:center;text-align:center;padding:24px;background:#104e78;font-size:clamp(20px,4vw,38px)"></div><p id="caption"></p></div><script>const titles=["Learning Objectives","El Niño Basics","ENSO Explained","Trade Winds & Global Circulation","Ocean & Atmosphere","Equatorial Kelvin Waves","Super El Niño","El Niño Quick Facts","What's Happening","What's Leading to Super El Niño?","Monterey Bay Impacts","Marine Impacts","Coastal Impacts","Economic Impacts","Impacts at MBA","Guest FAQs","Combating Doom-ism","Global Climate Impacts"];const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer'),slide=document.querySelector('#slide');let current=0;titles.forEach((t,i)=>{const b=document.createElement('button');b.className='card';b.textContent=(i+1)+'. '+t;b.onclick=()=>show(i);grid.append(b)});function show(i){current=(i+titles.length)%titles.length;viewer.classList.add('open');document.querySelector('#count').textContent=(current+1)+' / '+titles.length;document.querySelector('#caption').textContent=titles[current];slide.src='illustrations/'+String(current+1).padStart(2,'0')+'.jpg';slide.alt=titles[current];slide.hidden=true;document.querySelector('#pending').textContent=titles[current]+' — illustration pending scientific review and upload';}slide.onerror=()=>{slide.hidden=true;document.querySelector('#pending').hidden=false};slide.onload=()=>{slide.hidden=false;document.querySelector('#pending').hidden=true};document.querySelector('#close').onclick=()=>viewer.classList.remove('open');document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='Escape')viewer.classList.remove('open');if(viewer.classList.contains('open')&&e.key==='ArrowRight')show(current+1);if(viewer.classList.contains('open')&&e.key==='ArrowLeft')show(current-1)});</script><script type="module" src="../../core/app-contract.js"></script></html>
