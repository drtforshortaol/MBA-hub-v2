name: Validate V2 foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned fidelity parser
        run: python -m pip install --requirement scripts/migration/requirements-fidelity.txt
      - name: Build isolated developer and tester bundles
        run: npm run build
      - name: Verify contracts and offline isolation
        run: npm test
      - name: Verify strict content and offline media registration
        run: npm run content:check:all
      - name: Verify EVO classification evidence guards
        run: |
          python3 -m scripts.validation.validate_evo_relationship_classes
          python3 -m scripts.validation.validate_evo_classification_ambiguity
          python3 -m scripts.validation.validate_evo_original_narratives
          python3 -m scripts.validation.validate_evo_description_reconciliation
          python3 -m unittest scripts.validation.test_evo_relationship_classes
      - name: Scan reviewer bundle for security findings
        run: npm run security:scan
      - name: Verify reviewer artifact completeness and isolation
        run: node scripts/verify-build-artifacts.mjs
      - name: Retain tester bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: mba-v2-tester-foundation
          path: dist/tester
          retention-days: 30
