name: MBA V2 Development Validation
on:
  push:
    branches:
      - security-review-evo-foundation-20261014
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - '.github/workflows/october-v2-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifests and reference integrity
        run: npm run validate
      - name: Build isolated development distribution
        run: npm run build
      - name: Run automated regression tests
        run: npm test
      - name: Verify built tester artifacts remain intact after regressions
        run: node --test tests/security-review.test.mjs
      - name: Verify complete preview artifact integrity and isolation
        run: node scripts/verify-build-artifacts.mjs
      - name: Verify actual developer and tester bundles over local HTTP
        run: node scripts/verify-local-http.mjs --report-dir verification/http
      - name: Retain local HTTP acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mba-v2-local-http-evidence
          path: verification/http/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify all registered app and search routes offline
        run: node scripts/verify-offline-navigation.mjs --report-dir verification/offline
      - name: Retain simulated offline navigation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mba-v2-offline-navigation-evidence
          path: verification/offline/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run security scanner
        run: npm run security:scan
      - name: Check image and note assets
        run: node --test tests/october-seahorse.test.mjs
