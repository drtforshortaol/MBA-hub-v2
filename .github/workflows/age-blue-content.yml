name: AGE-008 Blue content regression audit (NO DEPLOY)
on:
  # Audit all PRs: a change anywhere in the repository may impact publishing.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blue-content-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact blue deployed source
        uses: actions/checkout@v4
        with:
          ref: 40e1826166f0ea61f406e1193390272029428734
          path: deployed-blue
          persist-credentials: false
      - name: Checkout candidate canonical source
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fail-closed Blue content preservation rules
        run: node --test candidate/tests/age-blue-content-fidelity.test.mjs
      - name: Produce source-accurate app/content regression inventory
        run: |
          node candidate/scripts/age/blue-content-fidelity.mjs deployed-blue candidate verification/age-008-blue-content-delta.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import path from 'node:path';
          const output='verification/age-008-blue-content-delta.json';
          const report=JSON.parse(fs.readFileSync(output,'utf8'));
          const revision=dir=>execFileSync('git',['-C',dir,'rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const sha=(dir,file)=>createHash('sha256').update(fs.readFileSync(path.join(dir,file))).digest('hex');
          if (revision('deployed-blue')!==report.baseline_source) throw Error('Deployed Blue checkout differs from the audit baseline');
          report.candidate_checkout_sha=revision('candidate');
          report.changed_source_file_hashes=report.changed_source_files.map(file=>({
            path:file,baseline_sha256:sha('deployed-blue',file),candidate_sha256:sha('candidate',file)
          }));
          fs.writeFileSync(output,JSON.stringify(report,null,2)+'\n');
          for(const app of report.app_differences){
            console.log('APP DELTA:',app.app_id,'missing sections:',app.missing_sections.length,
              'changed sections:',app.altered_sections.length,'missing media:',app.missing_media_ids.length,
              'missing offline paths:',app.missing_offline_asset_paths.length);
          }
          console.log('BLUE BASELINE CONTENT AUDIT:',report.release_eligible?'PASS':'BLOCKED');
          EOF
      - name: Save full review evidence even if release blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: age-008-blue-content-review
          path: verification/age-008-blue-content-delta.json
          if-no-files-found: error
          retention-days: 30
      - name: Block production inventory regressions on every pull request
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('verification/age-008-blue-content-delta.json','utf8'));
          if (!report.content_inventory_preserved) {
            console.error('Blue inventory regression. Inspect the AGE-008 review artifact.');
            process.exitCode=1;
          }
          EOF
      - name: Fail production release gate for unreviewed source/content loss
        if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
        run: node candidate/scripts/age/blue-content-fidelity.mjs deployed-blue candidate verification/age-008-blue-content-delta.json --strict
