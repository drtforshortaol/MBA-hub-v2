name: Blue MBA Hub V2 staging acceptance (NO DEPLOY)
on:
  pull_request:
    paths:
      - '.github/workflows/blue-stage-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blue-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch immutable current blue production baseline
        uses: actions/checkout@v4
        with:
          ref: 40e1826166f0ea61f406e1193390272029428734
          path: deployed-blue
          persist-credentials: false
      - name: Fetch immutable AGE-governed canonical release candidate
        uses: actions/checkout@v4
        with:
          ref: 78363a6739dbe1b63cac397bf9ac70dfa6b78958
          path: canonical
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate, build, test, and enforce AGE channel parity
        working-directory: canonical
        run: |
          npm run validate
          npm run build
          npm test
          node scripts/age/channel-registry.mjs
      - name: Strictly verify blue deployed content and original media are preserved
        run: |
          node canonical/scripts/age/blue-content-fidelity.mjs deployed-blue canonical verification/blue-content-fidelity.json --strict
      - name: Check blue visual identity, application IDs, and offline distribution
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='canonical/dist/tester/';
          const manifest=JSON.parse(fs.readFileSync(root+'manifest.webmanifest','utf8'));
          const environment=JSON.parse(fs.readFileSync(root+'environment.json','utf8'));
          const registry=JSON.parse(fs.readFileSync(root+'registry.json','utf8'));
          if(manifest.name!=='MBA Hub V2'||manifest.theme_color!=='#123e50')throw Error('Blue identity');
          if(environment.developer!==false||environment.namespace!=='mba-v2-tester')throw Error('Blue namespace');
          if(fs.existsSync(root+'core/developer.js'))throw Error('Developer controls leaked to blue');
          if(registry.apps.length!==38)throw Error('Expected 38 shared Guide apps, found '+registry.apps.length);
          for(const [id,category] of [['el-nino','concepts'],['nearby-dining','volunteer-tools'],
              ['big-bellied-seahorse','animals'],['ocellaris-clownfish','animals']]){
            const found=registry.apps.filter(a=>a.app_id===id);
            if(found.length!==1||found[0].category!==category)throw Error('Guide app registration '+id);
          }
          for(const app of registry.apps)for(const asset of app.offline_assets||[])
            if(!fs.existsSync(path.join(root,asset)))throw Error('Offline file missing '+app.app_id+':'+asset);
          for(let n=1;n<=18;n++){
            const image='apps/el-nino/images/slide-'+String(n).padStart(2,'0')+'.jpg';
            if(!fs.existsSync(root+image))throw Error('El Niño image '+n);
          }
          const qr=fs.readFileSync(root+'install.html','utf8');
          if(!qr.includes('MBA-hub-v2%2F')||qr.includes('MBA-hub-v2-dev%2F'))throw Error('Blue installation QR link');
          console.log('Blue staging acceptance passed: 38 shared apps; no developer controls; El Niño images 18.');
          EOF
      - name: Retain strict content fidelity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mba-blue-strict-fidelity-review
          path: verification/blue-content-fidelity.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain validated blue staging bundle (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: mba-blue-staging-validated
          path: canonical/dist/tester
          if-no-files-found: error
          retention-days: 7
