name: Security CI
on:
  pull_request:
  push:
    branches: [security-review-evo-foundation-20261014]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate provisional EVO classifications
        run: python scripts/validation/validate_evo_relationship_classes.py
      - name: Verify EVO candidate registry identity and approval boundary
        run: python scripts/validation/validate_evo_candidate_integrity.py
      - name: Run EVO negative mutation regressions
        run: python -m unittest discover -s scripts/validation -p 'test_evo_relationship_classes.py' -v
      - run: npm run validate
      - run: npm run build
      - run: npm run security:scan
      - run: npm test
