name: Publish orange MBA Hub DEV (public, separate Pages path)
on:
  workflow_dispatch:
  push:
    branches: [work/device-acceptance-prep-20261030]
    paths:
      - '.github/workflows/publish-orange-dev.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mba-v2-orange-dev-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser
        run: python -m pip install --requirement scripts/migration/requirements-fidelity.txt
      - name: Validate and build
        run: |
          npm run validate
          npm run build
          node scripts/audit-privacy-snapshot.mjs --write-reviewed-binding
          npm test
          npm run security:scan
          node scripts/verify-build-artifacts.mjs
      - name: Stage ONLY orange developer bundle under separate path
        run: |
          mkdir -p _site/dev
          cp -a dist/developer/. _site/dev/
          test -f _site/dev/manifest.webmanifest
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('_site/dev/manifest.webmanifest','utf8'));
          if(m.name!=='MBA Hub DEV'||m.id!=='./'||m.scope!=='./') throw Error('Not isolated orange DEV build');
          if(!fs.readFileSync('_site/dev/icon.svg','utf8').includes('#d66b12')) throw Error('Orange icon missing');
          if(fs.existsSync('_site/index.html'))throw Error('Root guide content must not be deployed');
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report deployed URL
        run: echo "Orange developer deployment: ${{ steps.deployment.outputs.page_url }}dev/"
