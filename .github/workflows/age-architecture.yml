name: AGE architecture validation
on:
  push:
    branches:
      - 'architecture/**'
  pull_request:
    paths:
      - 'scripts/age/**'
      - 'tests/age-*.test.mjs'
      - '.github/workflows/age-architecture.yml'
permissions:
  contents: read
jobs:
  age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: AGE unit tests
        run: node --test tests/age-*.test.mjs
