name: Combined iPhone Review Build
on:
  push:
    branches: [integration-iphone-review-20261018]
permissions:
  contents: read
jobs:
  review-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify combined review
        run: |
          npm run validate
          npm run build
          npm run content:check:all
          node scripts/plan-offline-media-registration.mjs
          npm run security:scan
          npm test
          node --test tests/security-review.test.mjs
          node scripts/verify-build-artifacts.mjs
          python3 -m unittest discover -s scripts/validation -p 'test_evo_*.py'
          python3 scripts/migration/test-fidelity-audit.py
          python3 -m unittest discover -s scripts/validation -p test_acceptance_record.py
      - name: Verify served developer and tester releases over HTTP
        run: |
          python3 -m http.server 8127 --bind 127.0.0.1 --directory dist > /tmp/mba-review-http.log 2>&1 &
          preview_server_pid=$!
          trap 'kill "$preview_server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent --output /dev/null http://127.0.0.1:8127/developer/release.json && break
            sleep 0.25
          done
          developer_release=$(node -p "require('./dist/developer/release.json').release")
          tester_release=$(node -p "require('./dist/tester/release.json').release")
          npm run verify:preview:http -- --url http://127.0.0.1:8127/developer/ --environment developer --expected-release "$developer_release" --report dist/developer-http-report.json
          npm run verify:preview:http -- --url http://127.0.0.1:8127/tester/ --environment tester --expected-release "$tester_release" --report dist/tester-http-report.json
      - name: Verify simulated offline navigation and corrupted-entry recovery
        run: node scripts/verify-offline-navigation.mjs --report-dir dist/offline-reports
      - name: Package review provenance and instructions
        run: |
          cp docs/iphone-review-20261018.md dist/REVIEW.md
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          sha256sum dist/developer/release.json dist/tester/release.json > dist/RELEASE-CHECKSUMS.txt
      - name: Bind retained reports to generated releases and checkout
        run: node scripts/verify-review-evidence.mjs dist "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: mba-v2-combined-iphone-review
          path: dist/
          if-no-files-found: error
          retention-days: 30
