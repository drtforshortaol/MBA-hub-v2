name: El Niño module checks
on:
  pull_request:
    paths:
      - 'src/apps/el-nino/**'
      - 'tests/el-nino-module.test.mjs'
      - '.github/workflows/el-nino-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 18 offline vector diagrams and Concepts manifest
        run: node --test tests/el-nino-module.test.mjs
      - name: Validate V2 registry contracts
        run: npm run validate
