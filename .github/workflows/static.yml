name: Deploy blue MBA Hub V2 Guide to Pages
# Guide Install & Help refresh: universal QR, persistent link and device-specific recovery instructions.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/static.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical Guide source branch
        uses: actions/checkout@v4
        with:
          ref: work/device-acceptance-prep-20261030
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned fidelity parser
        run: python -m pip install --requirement scripts/migration/requirements-fidelity.txt
      - name: Validate canonical source before distribution
        run: |
          npm run validate
          npm run build
          node scripts/audit-privacy-snapshot.mjs --write-reviewed-binding
          npm test
          npm run security:scan
          node scripts/verify-build-artifacts.mjs
      - name: Generate direct first-party Guide QR and rebuild verified Guide bundle
        env:
          MBA_GUIDE_PUBLIC_URL: https://drtforshortaol.github.io/MBA-hub-v2/
        run: |
          python -m pip install 'qrcode[pil]==8.2'
          python - <<'PY'
          from pathlib import Path
          import os, qrcode
          url=os.environ['MBA_GUIDE_PUBLIC_URL']
          assert url=='https://drtforshortaol.github.io/MBA-hub-v2/'
          qr=qrcode.QRCode(border=4, box_size=10, error_correction=qrcode.constants.ERROR_CORRECT_M)
          qr.add_data(url,optimize=0)
          qr.make(fit=True)
          qr.make_image(fill_color='black',back_color='white').save('src/install-qr.png')
          print('Guide installation QR directly encodes:',url)
          PY
          npm run build
          node scripts/verify-build-artifacts.mjs
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const d='dist/tester/';
          const m=JSON.parse(fs.readFileSync(d+'manifest.webmanifest','utf8'));
          const e=JSON.parse(fs.readFileSync(d+'environment.json','utf8'));
          if(m.name!=='MBA Hub V2'||m.theme_color!=='#123e50'||e.developer||e.namespace!=='mba-v2-tester')throw Error('Guide identity mismatch');
          if(fs.existsSync(d+'core/developer.js')||fs.readFileSync(d+'core/hub.js','utf8').includes('developerTaps'))throw Error('Developer controls found');
          if(!fs.readFileSync(d+'install.html','utf8').includes('Universal installation link and QR code'))throw Error('Guide QR not enabled');
          if(!fs.readFileSync(d+'icon.svg','utf8').includes('#123e50'))throw Error('Blue icon missing');
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tester
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Guide channel
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os,time,urllib.request,json
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=25) as response:
                  assert response.status==200
                  return response.read()
          for attempt in range(12):
              try:
                  env=json.loads(get('environment.json'))
                  manifest=json.loads(get('manifest.webmanifest'))
                  registry=json.loads(get('registry.json'))
                  assert env['environment']=='tester' and env['developer'] is False
                  assert env['namespace']=='mba-v2-tester'
                  assert manifest['name']=='MBA Hub V2' and manifest['theme_color']=='#123e50'
                  assert len(registry['apps'])>=30
                  assert b'#123e50' in get('icon.svg')
                  assert b'Universal installation link and QR code' in get('install.html')
                  assert len(get('install-qr.png'))>100
                  assert b'core/hub.js' in get('index.html')
                  hub=get('core/hub.js')
                  assert b"category:'volunteer-tools',title:'Nearby Dining'" in hub
                  assert b'https://drtforshortaol.github.io/MBA-nearby-dining/' in hub
                  print('Guide public delivery checks passed:',len(registry['apps']),'apps')
                  break
              except Exception as e:
                  if attempt==11:raise
                  print('Waiting for Pages propagation:',e)
                  time.sleep(15)
          PY
