name: Deploy MBA V2 Development Hub to Pages
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/static.yml"]
  workflow_dispatch:
  # Development changes live on a separate branch; scheduled runs deploy its latest validated build.
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved development branch
        uses: actions/checkout@v4
        with:
          ref: security-review-evo-foundation-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        run: |
          npm run validate
          npm run build
          npm test
          npm run security:scan
      - name: Prepare complete V2 hub preview
        run: |
          mkdir -p preview
          cp -a dist/developer/. preview/
          # Owner approved inclusion of the Seahorse photographs in the V2 preview.
          for image in IMG_4212.jpeg IMG_4213.jpeg IMG_4214.jpeg IMG_4215.jpeg IMG_4216.jpeg; do
            test -s "preview/apps/$image"
          done
          test -s preview/index.html
          test -s preview/registry.json
          test -s preview/apps/big-bellied-seahorse/index.html
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('preview')
          registry=json.loads((root/'registry.json').read_text())
          assert registry['apps'], 'empty app registry'
          for app in registry['apps']:
              entry=root/app['entry_point']
              assert entry.is_file(), f"Missing application: {app['app_id']}"
              for asset in app['offline_assets']:
                  assert (root/asset).is_file(), f"Missing offline asset: {asset}"
          assert any(a['app_id']=='big-bellied-seahorse' for a in registry['apps'])
          print(f"Verified {len(registry['apps'])} app entry points and offline asset paths")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published V2 Hub
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          def read(path):
              with urllib.request.urlopen(base+path, timeout=20) as response:
                  assert response.status==200, f"{path}: HTTP {response.status}"
                  return response.read()
          for attempt in range(8):
              try:
                  homepage=read('index.html')
                  assert b'core/hub.js' in homepage, 'Hub script not found'
                  registry=json.loads(read('registry.json'))
                  apps=registry['apps']
                  assert len(apps)>=32, 'Incomplete application collection'
                  assert len({a['app_id'] for a in apps})==len(apps), 'Duplicate application IDs'
                  assert all(a.get('entry_point') and a.get('offline_assets') for a in apps), 'Incomplete app manifests'
                  for app in apps:
                      assert app['entry_point'] in app['offline_assets'], f"Entry not cached: {app['app_id']}"
                      assert len(read(app['entry_point']))>0, f"Empty app: {app['app_id']}"
                  search=json.loads(read('search-index.json'))
                  assert all(any(item.get('app_id')==a['app_id'] for item in search) for a in apps), 'App missing from search'
                  read('manifest.webmanifest')
                  read('environment.json')
                  for image in ('IMG_4212.jpeg','IMG_4213.jpeg','IMG_4214.jpeg','IMG_4215.jpeg','IMG_4216.jpeg'):
                      assert len(read('apps/'+image))>100, image
                  read('release.json')
                  print(f"Published V2 smoke test passed: {len(apps)} apps, 5 Seahorse photos")
                  break
              except Exception as error:
                  if attempt==7: raise
                  print(f"Waiting for Pages propagation ({attempt+1}/8): {error}")
                  time.sleep(15)
          PY
