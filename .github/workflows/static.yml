name: Deploy Seahorse Development Preview to Pages
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/static.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved development branch
        uses: actions/checkout@v4
        with:
          ref: security-review-evo-foundation-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        run: |
          npm run validate
          npm run build
          npm test
          npm run security:scan
      - name: Prepare complete V2 hub preview
        run: |
          mkdir -p preview
          cp -a dist/developer/. preview/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('preview/apps/big-bellied-seahorse/index.html')
          html=p.read_text()
          html=re.sub(r'<figure>\s*<img\b[^>]*>\s*(?:<figcaption>.*?</figcaption>)?\s*</figure>', '<p>Illustration omitted pending publication permission.</p>', html, flags=re.S)
          p.write_text(html)
          assert '<img' not in html
          PY
          test -s preview/index.html
          test -s preview/registry.json
          test -s preview/apps/big-bellied-seahorse/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: deployment
        uses: actions/deploy-pages@v4
