name: Deploy MBA V2 Development Hub to Pages
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/static.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved development branch
        uses: actions/checkout@v4
        with:
          ref: security-review-evo-foundation-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        run: |
          npm run validate
          npm run build
          npm test
          npm run security:scan
      - name: Prepare complete V2 hub preview
        run: |
          mkdir -p preview
          cp -a dist/developer/. preview/
          # Owner approved inclusion of the Seahorse photographs in the V2 preview.
          for image in IMG_4212.jpeg IMG_4213.jpeg IMG_4214.jpeg IMG_4215.jpeg IMG_4216.jpeg; do
            test -s "preview/apps/$image"
          done
          test -s preview/index.html
          test -s preview/registry.json
          test -s preview/apps/big-bellied-seahorse/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: deployment
        uses: actions/deploy-pages@v4
