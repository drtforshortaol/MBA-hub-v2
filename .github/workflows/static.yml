name: Deploy blue MBA Hub V2 Guide to Pages
# Guide Install & Help refresh: universal QR, persistent link and device-specific recovery instructions.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/static.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical Guide source branch
        uses: actions/checkout@v4
        with:
          ref: fe3b11bd5af50558617cdb926d3bd51e996755e6
          persist-credentials: false
      - name: Remove Nearby Dining intermediate tap in pinned Guide source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/apps/nearby-dining/index.html')
          if not p.exists():
              raise SystemExit('Pinned Guide no longer contains Nearby Dining page; review deployment patch')
          html=p.read_text()
          url='https://drtforshortaol.github.io/MBA-nearby-dining/'
          if 'Open Nearby Dining' not in html or url not in html:
              raise SystemExit('Nearby Dining landing page changed; review redirect before deploying')
          html=html.replace('<head><meta charset="utf-8">','<head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url='+url+'">')
          html=html.replace('<body><header>','<body><script>window.location.replace("'+url+'");</script><header>')
          p.write_text(html)
          assert 'http-equiv="refresh"' in p.read_text()
          assert 'window.location.replace' in p.read_text()
          print('Nearby Dining intermediary now redirects immediately to restaurant search')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned fidelity parser
        run: python -m pip install --requirement scripts/migration/requirements-fidelity.txt
      - name: Validate canonical source before distribution
        run: |
          npm run validate
          npm run build
          npm test
          npm run security:scan
          node scripts/verify-build-artifacts.mjs
      - name: Generate direct first-party Guide QR and rebuild verified Guide bundle
        env:
          MBA_GUIDE_PUBLIC_URL: https://drtforshortaol.github.io/MBA-hub-v2/
        run: |
          python -m pip install 'qrcode[pil]==8.2'
          python - <<'PY'
          from pathlib import Path
          import os, qrcode
          url=os.environ['MBA_GUIDE_PUBLIC_URL']
          assert url=='https://drtforshortaol.github.io/MBA-hub-v2/'
          qr=qrcode.QRCode(border=4, box_size=10, error_correction=qrcode.constants.ERROR_CORRECT_M)
          qr.add_data(url,optimize=0)
          qr.make(fit=True)
          qr.make_image(fill_color='black',back_color='white').save('src/install-qr.png')
          print('Guide installation QR directly encodes:',url)
          PY
          npm run build
          node scripts/verify-build-artifacts.mjs
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const d='dist/tester/';
          const m=JSON.parse(fs.readFileSync(d+'manifest.webmanifest','utf8'));
          const e=JSON.parse(fs.readFileSync(d+'environment.json','utf8'));
          if(m.name!=='MBA Hub V2'||m.theme_color!=='#123e50'||e.developer||e.namespace!=='mba-v2-tester')throw Error('Guide identity mismatch');
          if(fs.existsSync(d+'core/developer.js')||fs.readFileSync(d+'core/hub.js','utf8').includes('developerTaps'))throw Error('Developer controls found');
          if(!fs.readFileSync(d+'install.html','utf8').includes('Universal installation link and QR code'))throw Error('Guide QR not enabled');
          if(!fs.readFileSync(d+'icon.svg','utf8').includes('#123e50'))throw Error('Blue icon missing');
          EOF
      - name: Verify canonical Blue registry and offline inventory
        run: |
          node scripts/age/channel-registry.mjs
          node scripts/verify-offline-navigation.mjs
      - name: Check out QR release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qr-release-tooling
          persist-credentials: false
      - name: Embed and verify all Blue app share codes
        run: |
          python -m pip install 'reportlab==4.4.9'
          python qr-release-tooling/scripts/append-guide-share-codes.py dist/tester
          node scripts/verify-build-artifacts.mjs
          node scripts/verify-offline-navigation.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tester
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify published Guide channel
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os,time,urllib.request,json
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=25) as response:
                  assert response.status==200
                  return response.read()
          for attempt in range(12):
              try:
                  env=json.loads(get('environment.json'))
                  manifest=json.loads(get('manifest.webmanifest'))
                  registry=json.loads(get('registry.json'))
                  assert env['environment']=='tester' and env['developer'] is False
                  assert env['namespace']=='mba-v2-tester'
                  assert manifest['name']=='MBA Hub V2' and manifest['theme_color']=='#123e50'
                  assert len(registry['apps'])==40
                  for app_id, category in [('el-nino','concepts'),('nearby-dining','volunteer-tools'),('giant-clam','animals'),('naturalist-briefing-20261118','aquarium-updates')]:
                      app=next(a for a in registry['apps'] if a['app_id']==app_id)
                      assert app['category']==category and app['listed']
                  inventory=json.loads(get('release.json'))
                  offline={resource['url'] for resource in inventory['resources']}
                  for guide in registry['apps']:
                      page=get(guide['entry_point'])
                      assert b'<details data-blue-share>' in page, guide['app_id']
                      assert b'Share app' in page, guide['app_id']
                  assert {'apps/el-nino/index.html','apps/nearby-dining/index.html'} <= offline
                  assert 'shared/media/giant-clam-monterey-bay-connections.jpg' not in offline
                  clam=get('apps/giant-clam/index.html')
                  assert b'id="monterey-bay-connections"' in clam
                  assert b'giant-clam-monterey-bay-connections.jpg' not in clam
                  for extra in ['giant-clam','naturalist-briefing-20261118']:
                      path=f'apps/{extra}/index.html'
                      assert path in offline
                      assert (base+path).encode() in get(path)
                  app=next(a for a in registry['apps'] if a['app_id']=='california-kelp-field-guide')
                  assert app['category']=='exhibits' and app['listed']
                  for app_id, category in [('naturalist-briefing-20261111','aquarium-updates'),('ocellaris-clownfish','animals')]:
                      guide=next(a for a in registry['apps'] if a['app_id']==app_id)
                      assert guide['category']==category and guide['listed']
                      assert b'class="title-image"' in get(guide['entry_point'])
                      for asset in guide['offline_assets']:
                          assert get(asset)
                  assert b'hatch sexually undifferentiated' in get('apps/ocellaris-clownfish/data.js')
                  notes=get('apps/naturalist-field-notes/data.js')
                  assert b'2026-11-11-ocean-in-motion' in notes
                  kelp=get(app['entry_point'])
                  assert kelp.count(b'class="restored-description"')==21
                  assert kelp.count(b'<div class="specimen-frame"><img')==21
                  assert b'id="expand"' in kelp and b'id="collapse"' in kelp
                  assert b'#123e50' in get('icon.svg')
                  assert b'Universal installation link and QR code' in get('install.html')
                  assert len(get('install-qr.png'))>100
                  assert b'core/hub.js' in get('index.html')
                  assert b'https://drtforshortaol.github.io/MBA-nearby-dining/' in get('apps/nearby-dining/index.html')
                  el_nino=get('apps/el-nino/index.html')
                  assert el_nino.count(b'<details class="subtopic"')==5
                  assert b'id="monterey-bay-by-season"' in el_nino
                  assert b'The 18 illustrations in this guide are pending permission review.' in el_nino
                  for n in range(1,19):
                      assert len(get(f'apps/el-nino/images/slide-{n:02}.jpg'))>100
                  print('Guide public delivery checks passed:',len(registry['apps']),'apps; El Niño images 18')
                  break
              except Exception as e:
                  if attempt==11:raise
                  print('Waiting for Pages propagation:',e)
                  time.sleep(15)
          PY
